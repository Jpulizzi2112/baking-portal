<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Admin — Pulizzi Pastry</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body { font-family: 'DM Sans', sans-serif; background: #fafafa; color: #111; min-height: 100vh; }

    .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; }
    .login-title { font-family: 'DM Serif Display', serif; font-size: 1.8rem; margin-bottom: 0.25rem; }
    .login-sub { font-size: 13px; color: #888; margin-bottom: 2rem; }
    .login-card { width: 100%; max-width: 360px; background: #fff; border: 0.5px solid #e5e5e5; border-radius: 16px; padding: 1.5rem; }
    .login-card label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    .login-card input { width: 100%; font-family: 'DM Sans', sans-serif; font-size: 16px; padding: 12px 14px; border: 0.5px solid #ccc; border-radius: 10px; outline: none; margin-bottom: 1rem; }
    .login-card input:focus { border-color: #999; }
    .login-error { font-size: 13px; color: #8b0000; margin-bottom: 0.75rem; display: none; }
    .login-error.show { display: block; }

    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 13px; border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s; }
    .btn:active { opacity: 0.75; }
    .btn-dark { background: #111; color: #fff; }
    .btn-green { background: #3b6d11; color: #fff; }
    .btn-outline { background: transparent; border: 0.5px solid #ccc; color: #111; }
    .btn-danger { background: #fdecea; color: #8b0000; }
    .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; border-radius: 8px; }

    .dashboard { display: none; flex-direction: column; min-height: 100vh; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; background: #fff; border-bottom: 0.5px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-family: 'DM Serif Display', serif; font-size: 1.2rem; }
    .topbar-logout { font-size: 13px; color: #888; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 0.5px solid #e5e5e5; background: transparent; font-family: 'DM Sans', sans-serif; }

    .tabs { display: flex; border-bottom: 0.5px solid #e5e5e5; background: #fff; }
    .tab { flex: 1; padding: 12px; text-align: center; font-size: 14px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .tab.active { color: #111; border-bottom-color: #111; }

    .tab-content { display: none; padding: 1.25rem; flex: 1; }
    .tab-content.active { display: block; }

    .settings-strip { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
    .settings-strip label { font-size: 12px; color: #888; display: block; margin-bottom: 4px; }
    .settings-row { display: flex; gap: 10px; align-items: center; }
    .settings-strip input[type="text"] { flex: 1; font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 12px; border: 0.5px solid #ccc; border-radius: 8px; outline: none; }
    .settings-strip input[type="text"]:focus { border-color: #999; }
    .toggle-wrap { display: flex; align-items: center; gap: 10px; margin-top: 0.75rem; padding-top: 0.75rem; border-top: 0.5px solid #f0f0f0; }
    .toggle-label { font-size: 14px; flex: 1; }
    .toggle { position: relative; width: 44px; height: 26px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: #ccc; border-radius: 26px; cursor: pointer; transition: background 0.2s; }
    .toggle-slider:before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
    .toggle input:checked + .toggle-slider { background: #3b6d11; }
    .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

    .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #888; }

    .item-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
    .item-row { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.25rem; }
    .item-row.inactive { opacity: 0.5; }
    .item-row-top { display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; }
    .item-emoji { font-size: 1.6rem; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-name-text { font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-tag-text { font-size: 12px; color: #888; }
    .item-row-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .item-form { background: #fff; border: 1.5px solid #185fa5; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .item-form.hidden { display: none; }
    .form-title-row { font-size: 13px; font-weight: 500; color: #185fa5; margin-bottom: 1rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .form-field { display: flex; flex-direction: column; gap: 4px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { font-size: 12px; color: #888; }
    .form-field input, .form-field textarea { font-family: 'DM Sans', sans-serif; font-size: 14px; padding: 9px 12px; border: 0.5px solid #ccc; border-radius: 8px; outline: none; width: 100%; }
    .form-field input:focus, .form-field textarea:focus { border-color: #999; }
    .form-field textarea { min-height: 70px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; }

    .sub-list { display: flex; flex-direction: column; gap: 10px; }
    .sub-card { background: #fff; border: 0.5px solid #e5e5e5; border-radius: 12px; padding: 1rem 1.25rem; }
    .sub-name { font-weight: 500; font-size: 15px; margin-bottom: 4px; }
    .sub-items { font-size: 13px; color: #111; margin-bottom: 4px; }
    .sub-note { font-size: 12px; color: #888; font-style: italic; margin-bottom: 6px; }
    .sub-date { font-size: 11px; color: #bbb; }

    .empty { text-align: center; color: #aaa; font-size: 13px; padding: 2rem 0; }
    .loading-msg { color: #aaa; font-size: 13px; padding: 1rem 0; }
    .save-flash { font-size: 12px; color: #3b6d11; margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
    .save-flash.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="login-wrap" id="login-screen">
    <p class="login-title">Pulizzi Pastry</p>
    <p class="login-sub">Admin access</p>
    <div class="login-card">
      <label>Password</label>
      <input type="password" id="pw-input" placeholder="Enter password" />
      <p class="login-error" id="login-error">Incorrect password — try again.</p>
      <button class="btn btn-dark" onclick="attemptLogin()">Sign in</button>
    </div>
  </div>

  <div class="dashboard" id="dashboard">

    <div class="topbar">
      <span class="topbar-title">Admin</span>
      <button class="topbar-logout" onclick="logout()">Sign out</button>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('catalog', this)">Catalog</div>
      <div class="tab" onclick="switchTab('requests', this)">Requests</div>
    </div>

    <div class="tab-content active" id="tab-catalog">

      <div class="settings-strip">
        <label>Drop date label</label>
        <div class="settings-row">
          <input type="text" id="drop-label-input" placeholder="e.g. Saturday, May 24" />
          <button class="btn btn-outline btn-sm" onclick="saveSettings()">Save</button>
          <span class="save-flash" id="settings-flash">Saved!</span>
        </div>
        <div class="toggle-wrap">
          <span class="toggle-label">Taking requests</span>
          <label class="toggle">
            <input type="checkbox" id="taking-requests-toggle" onchange="saveSettings()" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="section-head">
        <span class="section-title">Items</span>
        <button class="btn btn-green btn-sm" onclick="showAddForm()">+ Add item</button>
      </div>

      <div class="item-form hidden" id="item-form">
        <p class="form-title-row" id="form-heading">New item</p>
        <div class="form-grid">
          <div class="form-field">
            <label>Emoji</label>
            <input type="text" id="f-emoji" placeholder="🍰" maxlength="4" />
          </div>
          <div class="form-field">
            <label>Tag / category</label>
            <input type="text" id="f-tag" placeholder="classic" />
          </div>
          <div class="form-field full">
            <label>Name</label>
            <input type="text" id="f-name" placeholder="Brown Butter Cupcake" />
          </div>
          <div class="form-field full">
            <label>Description</label>
            <textarea id="f-desc" placeholder="Short description..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-green btn-sm" onclick="saveItem()">Save item</button>
          <button class="btn btn-outline btn-sm" onclick="hideForm()">Cancel</button>
        </div>
      </div>

      <div class="item-list" id="item-list">
        <p class="loading-msg">Loading...</p>
      </div>

    </div>

    <div class="tab-content" id="tab-requests">
      <div class="section-head">
        <span class="section-title">Submissions</span>
      </div>
      <div class="sub-list" id="sub-list">
        <p class="loading-msg">Loading...</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://dpyjnhgmmipuzaeeazhn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_OmKYXTwP296JbwO1ueT5XA_w_Kpb4mi';

    const headers = {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`
    };

    let catalogItems = [];
    let editingId = null;

    async function attemptLogin() {
      const pw = document.getElementById('pw-input').value.trim();
      const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1&select=admin_password`, { headers });
      const data = await res.json();
      if (!data.length || data[0].admin_password !== pw) {
        document.getElementById('login-error').classList.add('show');
        return;
      }
      sessionStorage.setItem('admin_auth', 'true');
      showDashboard();
    }

    function logout() {
      sessionStorage.removeItem('admin_auth');
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('login-screen').style.display = 'flex';
    }

    function showDashboard() {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'flex';
      loadSettings();
      loadCatalog();
    }

    document.getElementById('pw-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') attemptLogin();
    });

    if (sessionStorage.getItem('admin_auth')) showDashboard();

    function switchTab(name, el) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('tab-' + name).classList.add('active');
      if (name === 'requests') loadSubmissions();
    }

    async function loadSettings() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, { headers });
      const data = await res.json();
      if (!data.length) return;
      document.getElementById('drop-label-input').value = data[0].drop_label || '';
      document.getElementById('taking-requests-toggle').checked = data[0].taking_requests;
    }

    async function saveSettings() {
      const drop_label = document.getElementById('drop-label-input').value.trim();
      const taking_requests = document.getElementById('taking-requests-toggle').checked;
      await fetch(`${SUPABASE_URL}/rest/v1/settings?id=eq.1`, {
        method: 'PATCH',
        headers: { ...headers, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ drop_label, taking_requests })
      });
      const flash = document.getElementById('settings-flash');
      flash.classList.add('show');
      setTimeout(() => flash.classList.remove('show'), 2000);
    }

    async function loadCatalog() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/catalog?order=id.asc`, { headers });
      catalogItems = await res.json();
      renderCatalog();
    }

    function renderCatalog() {
      const list = document.getElementById('item-list');
      if (!catalogItems.length) {
        list.innerHTML = '<p class="empty">No items yet — add one above.</p>';
        return;
      }
      list.innerHTML = catalogItems.map(item => `
        <div class="item-row ${item.active ? '' : 'inactive'}" id="row-${item.id}">
          <div class="item-row-top">
            <span class="item-emoji">${item.emoji || '🍰'}</span>
            <div class="item-info">
              <p class="item-name-text">${item.name}</p>
              <p class="item-tag-text">${item.tag || ''}${!item.active ? ' · hidden' : ''}</p>
            </div>
          </div>
          <div class="item-row-actions">
            <button class="btn btn-outline btn-sm" onclick="editItem(${item.id})">Edit</button>
            <button class="btn btn-outline btn-sm" onclick="toggleActive(${item.id}, ${item.active})">${item.active ? 'Hide' : 'Show'}</button>
            <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">Delete</button>
          </div>
        </div>`).join('');
    }

    function showAddForm() {
      editingId = null;
      document.getElementById('form-heading').textContent = 'New item';
      document.getElementById('f-emoji').value = '';
      document.getElementById('f-name').value = '';
      document.getElementById('f-desc').value = '';
      document.getElementById('f-tag').value = '';
      document.getElementById('item-form').classList.remove('hidden');
      document.getElementById('f-name').focus();
    }

    function editItem(id) {
      const item = catalogItems.find(i => i.id === id);
      if (!item) return;
      editingId = id;
      document.getElementById('form-heading').textContent = 'Edit item';
      document.getElementById('f-emoji').value = item.emoji || '';
      document.getElementById('f-name').value = item.name || '';
      document.getElementById('f-desc').value = item.description || '';
      document.getElementById('f-tag').value = item.tag || '';
      document.getElementById('item-form').classList.remove('hidden');
      document.getElementById('item-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function hideForm() {
      document.getElementById('item-form').classList.add('hidden');
      editingId = null;
    }

    async function saveItem() {
      const payload = {
        emoji: document.getElementById('f-emoji').value.trim(),
        name: document.getElementById('f-name').value.trim(),
        description: document.getElementById('f-desc').value.trim(),
        tag: document.getElementById('f-tag').value.trim(),
      };
      if (!payload.name) { document.getElementById('f-name').focus(); return; }

      if (editingId) {
        await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${editingId}`, {
          method: 'PATCH',
          headers: { ...headers, 'Prefer': 'return=minimal' },
          body: JSON.stringify(payload)
        });
      } else {
        payload.active = true;
        await fetch(`${SUPABASE_URL}/rest/v1/catalog`, {
          method: 'POST',
          headers: { ...headers, 'Prefer': 'return=minimal' },
          body: JSON.stringify(payload)
        });
      }
      hideForm();
      loadCatalog();
    }

    async function toggleActive(id, current) {
      await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}`, {
        method: 'PATCH',
        headers: { ...headers, 'Prefer': 'return=minimal' },
        body: JSON.stringify({ active: !current })
      });
      loadCatalog();
    }

    async function deleteItem(id) {
      if (!confirm('Delete this item? This cannot be undone.')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/catalog?id=eq.${id}`, {
        method: 'DELETE',
        headers
      });
      loadCatalog();
    }

    async function loadSubmissions() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/submissions?order=created_at.desc`, { headers });
      const subs = await res.json();
      const list = document.getElementById('sub-list');
      if (!subs.length) { list.innerHTML = '<p class="empty">No requests yet.</p>'; return; }
      list.innerHTML = subs.map(s => {
        const date = new Date(s.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `
        <div class="sub-card">
          <p class="sub-name">${s.name}</p>
          ${s.items ? `<p class="sub-items">${s.items}</p>` : ''}
          ${s.note ? `<p class="sub-note">"${s.note}"</p>` : ''}
          <p class="sub-date">${date}</p>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
